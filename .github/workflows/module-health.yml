name: Module health
on:
  schedule:
    - cron: "23 4 * * *"   # daily, 04:23 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Runs every module's positive and negative fixture on Supabase (the module-health
      # Edge Function), from the same servers real searches use, a slice per request.
      - name: Check every source and save the results
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          off=0; total=1; ok=0; checked=0
          while [ "$off" -lt "$total" ]; do
            r=$(curl -sS --fail-with-body --retry 3 --retry-all-errors --max-time 120 -X POST "$SUPABASE_URL/functions/v1/module-health" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "content-type: application/json" -d "{\"offset\":$off,\"limit\":10}")
            total=$(echo "$r" | jq .total); ok=$((ok + $(echo "$r" | jq .ok))); checked=$((checked + $(echo "$r" | jq .checked)))
            echo "$r" | jq -r '.not_ok[]'
            off=$((off + 10))
          done
          echo "$ok/$checked ok"
