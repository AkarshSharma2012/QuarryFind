name: Module health
on:
  schedule:
    - cron: "23 4 * * *"   # daily, 04:23 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run every module's positive and negative fixture, upload results
        run: node --disable-warning=ExperimentalWarning scripts/fixtures.ts --upload > /dev/null
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.FIXTURES_GITHUB_TOKEN }}
